# The witness reader (PADR-0020): a workload identity in read only, audience https://app.runward.dev/read,
# authorized by the member fleet by fleet. Each day it reads the served index and the export of each
# authorized fleet, replays the export with runward-fleet (criterion S1 b), and compares the head of main
# of each declared repository with the commit of its last accepted upload (T26). Its results are this
# run's summary and artifact; nothing here writes to the service. Off until the service is deployed and a
# fleet has authorized it: set RW_READER_ENABLED to true and RW_READER_FLEETS to the fleet ids.
name: temoin
on:
  schedule: [{ cron: "41 5 * * *" }]
  workflow_dispatch:
permissions: {}
jobs:
  read:
    if: ${{ vars.RW_READER_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: read, replay, compare
        env: { FLEETS: "${{ vars.RW_READER_FLEETS }}", SERVICE: "https://app.runward.dev", GH_TOKEN: "${{ github.token }}" }
        run: node scripts/witness-reader.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with: { name: witness-reader, path: "${{ runner.temp }}/witness", if-no-files-found: ignore, retention-days: 90 }
