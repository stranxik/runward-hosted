# The deployment chain (PADR-0015 and its note), WRITTEN BUT OFF. It runs only when the repository variable
# RW_DEPLOY_ENABLED is true, which the author sets after approving the paid resources (runward/runbook.md,
# "Resources to create"). In order, each step blocking:
#   1. the gate and the tests are green for this exact commit (the ci workflow's run for github.sha);
#   2. the image is built here from a clean checkout at github.sha and pushed; it is deployed BY DIGEST,
#      first to the operator's gateway (ADR-0016), which then runs `roles` (rw_admin) and `migrate`
#      (rw_owner) on the private database, then `roles` again with grants: what rw_app and rw_maint may do
#      on the migrated base is what db/schema.snapshot.txt says, no more, no fewer, or the deploy stops;
#      only then to the service: the schema is ready before the service switches;
#   3. the revision served, read from the hoster's API (not from /api/version), carries that digest (S5),
#      and the container's environment was merged, not replaced (scripts/container-deploy.sh);
#   4. /api/version says the same commit and image;
#   5. smoke: health, version, sign-in options, the page, 421, the request budget; the 421 is the app's own
#      (host-not-allowed), asked under the container's default hostname at the hoster, which the hoster
#      routes to the service and the app does not serve (vars.RW_SERVICE_HOST; without it nothing is built,
#      nor when it is not the hostname the hoster reports for the service's container);
#   6. the real send workflow of this commit sends to the witness tenant (job smoke-send);
#   7. the isolation suite on the deployed base, through the gateway in the private network, under rw_app (S4);
#   8. the registry keeps the 5 newest images and every digest still served or named for rollback;
#   9. any failure after the deploy redeploys, on both containers, the digest served before.
# The Scaleway key and the operator's token live in the environment "production", reserved to main; no PR
# can read them. The first deploy needs the containers to exist: runward/runbook.md §12 (push-image.yml,
# then OpenTofu phase 2 with that digest).
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: {}
concurrency: { group: deploy-production, cancel-in-progress: false }
env:
  REGION: fr-par
  REGISTRY: rg.fr-par.scw.cloud/runward
  SERVICE: https://app.runward.dev
jobs:
  verdict:
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions: { actions: read, checks: read, contents: read }
    steps:
      - name: the ci run of this exact commit is green, every job (no check is a refusal)
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ github.sha }}", REPO: "${{ github.repository }}" }
        run: |
          for i in $(seq 1 60); do
            run=$(gh run list -R "$REPO" --workflow ci.yml --commit "$SHA" --json databaseId,status,conclusion -q '.[0]')
            [ -n "$run" ] && [ "$(echo "$run" | jq -r .status)" = "completed" ] && break; sleep 20
          done
          [ "$(echo "$run" | jq -r .conclusion)" = "success" ] || { echo "ci is not green for $SHA: no deploy"; exit 1; }

  deploy:
    needs: verdict
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    outputs:
      digest: "${{ steps.push.outputs.digest }}"
      previous: "${{ steps.before.outputs.previous }}"
      previous_commit: "${{ steps.before.outputs.previous_commit }}"
      previous_operator: "${{ steps.before.outputs.previous_operator }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: the smoke can reach the app's own 421 (vars.RW_SERVICE_HOST is set), or nothing is built or deployed
        env: { RW_SERVICE_HOST: "${{ vars.RW_SERVICE_HOST }}" }
        run: |
          [ -n "$RW_SERVICE_HOST" ] || { echo "vars.RW_SERVICE_HOST is not set: the container's default hostname at the hoster (runward/runbook.md §12, step 4). Without it the smoke cannot prove the app's 421: no deploy."; exit 1; }
          [ "https://$RW_SERVICE_HOST" != "$SERVICE" ] || { echo "vars.RW_SERVICE_HOST is the service's own host: the app serves it, it would not be refused"; exit 1; }
      - name: the digests served before this deploy (the rollback targets)
        id: before
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}", OPERATOR: "${{ vars.SCW_OPERATOR_CONTAINER_ID }}", RW_SERVICE_HOST: "${{ vars.RW_SERVICE_HOST }}" }
        run: |
          api="https://api.scaleway.com/containers/v1beta1/regions/$REGION/containers"
          svc=$(curl -sSf --max-time 30 -H @<(printf 'X-Auth-Token: %s\n' "$SCW_SECRET_KEY") "$api/$CONTAINER")
          # vars.RW_SERVICE_HOST is this container's own hostname at the hoster, or nothing is built: the
          # outputs below stay empty on a refusal, so the rollback job does not run
          scripts/service-host-check.sh "$RW_SERVICE_HOST" <<<"$svc"
          op=$(curl -sSf --max-time 30 -H @<(printf 'X-Auth-Token: %s\n' "$SCW_SECRET_KEY") "$api/$OPERATOR")
          echo "previous=$(jq -r .registry_image <<<"$svc")" >> "$GITHUB_OUTPUT"
          echo "previous_commit=$(jq -r '.environment_variables.RW_COMMIT // ""' <<<"$svc")" >> "$GITHUB_OUTPUT"
          echo "previous_operator=$(jq -r .registry_image <<<"$op")" >> "$GITHUB_OUTPUT"
      - name: build at ${{ github.sha }} and push; the digest names what was built
        id: push
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}" }
        run: |
          docker build --pull=false --build-arg RW_COMMIT=${{ github.sha }} -t "$REGISTRY/runward-hosted:${{ github.sha }}" .
          echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
          docker push "$REGISTRY/runward-hosted:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/runward-hosted:${{ github.sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: the operator's gateway serves the new digest (S5 on the gateway)
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", OPERATOR: "${{ vars.SCW_OPERATOR_CONTAINER_ID }}", DIGEST: "${{ steps.push.outputs.digest }}" }
        run: scripts/container-deploy.sh "$OPERATOR" "$DIGEST" "${{ github.sha }}"
      - name: roles (rw_admin), migrate (rw_owner), then the grants of rw_app and rw_maint against the snapshot, through the gateway, before the service switches
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", RW_OPERATOR_TOKEN: "${{ secrets.RW_OPERATOR_TOKEN }}", RW_OPERATOR_URL: "${{ vars.RW_OPERATOR_URL }}" }
        run: |
          scripts/operator-call.sh roles
          scripts/operator-call.sh migrate
          scripts/operator-call.sh roles '{"grants":true}'
      - name: the service serves the new digest (S5, read from the hoster, not from the service)
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}", DIGEST: "${{ steps.push.outputs.digest }}" }
        run: scripts/container-deploy.sh "$CONTAINER" "$DIGEST" "${{ github.sha }}"
      - name: /api/version says the same commit and image
        env: { DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          for i in $(seq 1 60); do
            v=$(curl -sf --max-time 30 "$SERVICE/api/version" || true)
            [ "$(echo "$v" | jq -r .commit)" = "${{ github.sha }}" ] && [ "$(echo "$v" | jq -r .image)" = "$DIGEST" ] && exit 0; sleep 10
          done
          echo "/api/version does not serve ${{ github.sha }} at $DIGEST"; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22" }
      - name: smoke (health, version, sign-in options, page, the app's own 421, budget of the entry screen)
        env: { RW_SERVICE_HOST: "${{ vars.RW_SERVICE_HOST }}" }
        run: node scripts/smoke.mjs "$SERVICE" "${{ github.sha }}"

  smoke-send:
    # The real send workflow of this very commit, to the witness tenant (PADR-0015 note): the service accepts
    # main SHAs of send.yml for that tenant only.
    needs: deploy
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/send.yml
    with: { mission: runward-hosted, send-strict: true }

  isolation:
    needs: smoke-send
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: S4, the isolation suite on the deployed base, through the gateway in the private network, under rw_app
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", RW_OPERATOR_TOKEN: "${{ secrets.RW_OPERATOR_TOKEN }}", RW_OPERATOR_URL: "${{ vars.RW_OPERATOR_URL }}" }
        run: scripts/operator-call.sh isolation

  purge:
    # The registry keeps the 5 newest images; a digest served (the new one) or named for rollback (the one
    # served before, on either container) is never deleted, whatever its age.
    needs: [deploy, isolation]
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22" }
      - name: delete the images beyond the 5 newest
        env:
          SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}"
          PROTECT: "${{ needs.deploy.outputs.digest }},${{ needs.deploy.outputs.previous }},${{ needs.deploy.outputs.previous_operator }}"
        run: node scripts/registry-purge.mjs --keep 5 --protect "$PROTECT"

  rollback:
    needs: [deploy, smoke-send, isolation]
    if: ${{ failure() && vars.RW_DEPLOY_ENABLED == 'true' && needs.deploy.outputs.previous != '' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: redeploy the digests served before, on the service and on the gateway, then wait for /api/version
        env:
          SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}"
          CONTAINER: "${{ vars.SCW_CONTAINER_ID }}"
          OPERATOR: "${{ vars.SCW_OPERATOR_CONTAINER_ID }}"
          PREV: "${{ needs.deploy.outputs.previous }}"
          PREV_COMMIT: "${{ needs.deploy.outputs.previous_commit }}"
          PREV_OPERATOR: "${{ needs.deploy.outputs.previous_operator }}"
        run: |
          scripts/container-deploy.sh "$CONTAINER" "$PREV" "$PREV_COMMIT"
          [ -z "$PREV_OPERATOR" ] || scripts/container-deploy.sh "$OPERATOR" "$PREV_OPERATOR"
          for i in $(seq 1 60); do [ "$(curl -sf --max-time 30 "$SERVICE/api/version" | jq -r .image)" = "$PREV" ] && exit 0; sleep 10; done; exit 1
