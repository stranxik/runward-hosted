# The deployment chain (PADR-0015 and its note), WRITTEN BUT OFF. It runs only when the repository variable
# RW_DEPLOY_ENABLED is true, which the author sets after approving the paid resources (runward/runbook.md,
# "Resources to create"). In order, each step blocking:
#   1. the gate and the tests are green for this exact commit (the ci workflow's run for github.sha);
#   2. the image is built here from a clean checkout at github.sha, pushed, and deployed BY DIGEST;
#   3. the revision served, read from the hoster's API (not from /api/version), carries that digest (S5);
#   4. /api/version says the same commit and image;
#   5. smoke: health, version, sign-in options, the page, 421, the request budget;
#   6. the real send workflow of this commit sends to the witness tenant (job smoke-send);
#   7. the isolation suite on the deployed base, as a hoster job in the private network, under rw_app (S4);
#   8. any failure after the deploy redeploys the last digest whose evidence folder is green.
# The Scaleway key lives in the environment "production", reserved to main; no PR can read it.
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: {}
concurrency: { group: deploy-production, cancel-in-progress: false }
env:
  REGION: fr-par
  REGISTRY: rg.fr-par.scw.cloud/runward
  SERVICE: https://app.runward.dev
jobs:
  verdict:
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions: { actions: read, checks: read, contents: read }
    steps:
      - name: the ci run of this exact commit is green, every job (no check is a refusal)
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ github.sha }}", REPO: "${{ github.repository }}" }
        run: |
          for i in $(seq 1 60); do
            run=$(gh run list -R "$REPO" --workflow ci.yml --commit "$SHA" --json databaseId,status,conclusion -q '.[0]')
            [ -n "$run" ] && [ "$(echo "$run" | jq -r .status)" = "completed" ] && break; sleep 20
          done
          [ "$(echo "$run" | jq -r .conclusion)" = "success" ] || { echo "ci is not green for $SHA: no deploy"; exit 1; }

  deploy:
    needs: verdict
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    outputs: { digest: "${{ steps.push.outputs.digest }}", previous: "${{ steps.before.outputs.previous }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: the digest served before this deploy (the rollback target)
        id: before
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}" }
        run: |
          prev=$(curl -sSf -H "X-Auth-Token: $SCW_SECRET_KEY" "https://api.scaleway.com/containers/v1beta1/regions/$REGION/containers/$CONTAINER" | jq -r .registry_image)
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
      - name: build at ${{ github.sha }} and push; the digest names what was built
        id: push
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}" }
        run: |
          docker build --pull=false --build-arg RW_COMMIT=${{ github.sha }} -t "$REGISTRY/runward-hosted:${{ github.sha }}" .
          echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
          docker push "$REGISTRY/runward-hosted:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/runward-hosted:${{ github.sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: deploy the revision by digest, never by tag
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}", DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          api="https://api.scaleway.com/containers/v1beta1/regions/$REGION/containers/$CONTAINER"
          curl -sSf -X PATCH -H "X-Auth-Token: $SCW_SECRET_KEY" -H 'content-type: application/json' "$api" \
            -d "$(jq -n --arg img "$DIGEST" --arg c "${{ github.sha }}" '{registry_image: $img, environment_variables: {RW_COMMIT: $c, RW_IMAGE: $img}}')" >/dev/null
          curl -sSf -X POST -H "X-Auth-Token: $SCW_SECRET_KEY" -H 'content-type: application/json' "$api/deploy" -d '{}' >/dev/null
      - name: S5, the revision served carries the built digest (read from the hoster, not from the service)
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}", DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          for i in $(seq 1 60); do
            c=$(curl -sSf -H "X-Auth-Token: $SCW_SECRET_KEY" "https://api.scaleway.com/containers/v1beta1/regions/$REGION/containers/$CONTAINER")
            [ "$(echo "$c" | jq -r .status)" = "ready" ] && [ "$(echo "$c" | jq -r .registry_image)" = "$DIGEST" ] && exit 0; sleep 10
          done
          echo "the revision served is not $DIGEST"; exit 1
      - name: /api/version says the same commit and image
        env: { DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          for i in $(seq 1 60); do
            v=$(curl -sf --max-time 30 "$SERVICE/api/version" || true)
            [ "$(echo "$v" | jq -r .commit)" = "${{ github.sha }}" ] && [ "$(echo "$v" | jq -r .image)" = "$DIGEST" ] && exit 0; sleep 10
          done
          echo "/api/version does not serve ${{ github.sha }} at $DIGEST"; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22" }
      - name: smoke (health, version, sign-in options, page, 421, budget of the entry screen)
        run: node scripts/smoke.mjs "$SERVICE" "${{ github.sha }}"

  smoke-send:
    # The real send workflow of this very commit, to the witness tenant (PADR-0015 note): the service accepts
    # main SHAs of send.yml for that tenant only.
    needs: deploy
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/send.yml
    with: { mission: runward-hosted, send-strict: true }

  isolation:
    needs: smoke-send
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}
    steps:
      - name: S4, the isolation suite as a hoster job in the private network, under rw_app
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", JOB: "${{ vars.SCW_ISOLATION_JOB_ID }}" }
        run: |
          api="https://api.scaleway.com/serverless-jobs/v1alpha1/regions/$REGION"
          run=$(curl -sSf -X POST -H "X-Auth-Token: $SCW_SECRET_KEY" -H 'content-type: application/json' "$api/job-definitions/$JOB/start" -d '{"command":"node scripts/isolation-deployed.mjs"}' | jq -r '.job_runs[0].id')
          for i in $(seq 1 60); do
            s=$(curl -sSf -H "X-Auth-Token: $SCW_SECRET_KEY" "$api/job-runs/$run" | jq -r .state)
            [ "$s" = "succeeded" ] && exit 0; [ "$s" = "failed" ] && { echo "isolation suite failed"; exit 1; }; sleep 10
          done; exit 1

  rollback:
    needs: [deploy, smoke-send, isolation]
    if: ${{ failure() && vars.RW_DEPLOY_ENABLED == 'true' && needs.deploy.outputs.previous != '' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}
    steps:
      - name: redeploy the last green digest, then wait for /api/version
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}", PREV: "${{ needs.deploy.outputs.previous }}" }
        run: |
          api="https://api.scaleway.com/containers/v1beta1/regions/$REGION/containers/$CONTAINER"
          curl -sSf -X PATCH -H "X-Auth-Token: $SCW_SECRET_KEY" -H 'content-type: application/json' "$api" -d "$(jq -n --arg img "$PREV" '{registry_image: $img, environment_variables: {RW_IMAGE: $img}}')" >/dev/null
          curl -sSf -X POST -H "X-Auth-Token: $SCW_SECRET_KEY" -H 'content-type: application/json' "$api/deploy" -d '{}' >/dev/null
          for i in $(seq 1 60); do [ "$(curl -sf "$SERVICE/api/version" | jq -r .image)" = "$PREV" ] && exit 0; sleep 10; done; exit 1
