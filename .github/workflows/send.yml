# The send workflow of runward hosted (PADR-0010, note of 2026-11-06, 7 bis to 7 sexies). A customer's
# workflow calls it at the commit of a release:
#
#   jobs:
#     runward:
#       permissions: { contents: read, id-token: write }
#       uses: stranxik/runward-hosted/.github/workflows/send.yml@<sha of the release>
#       with: { mission: dropyour }
#
# Three jobs. `check` judges and never holds id-token; `send` alone holds id-token, runs no third-party
# step besides GitHub's own artifact actions, and sends only what `check` wrote; `verdict` gives the run
# runward's exit code, so a refusal rises and the CI keeps runward's colour. A failed upload warns and
# never fails the run, unless send-strict. Nothing from the customer's repository is executed: runward is
# installed outside the checkout without scripts, and `check` never passes --hooks. Its output is written
# under $RUNNER_TEMP, never in the checkout, so a file committed by an agent never leaves as runward's.
# Release v0.1 sends `check` only.
#
# `runner` (optional) says where the three jobs run, as JSON: '"ubuntu-24.04"' by default, or a list of
# labels for a repository whose CI runs on its own runner:
#
#       with: { mission: dropyour, runner: '["self-hosted","nas"]' }
#
# It is read by fromJSON in runs-on, never by a shell; a value that is not JSON stops the run before a job
# starts. The runner needs bash 4, curl, openssl, base64 and sha256sum (GNU coreutils), and reaches
# registry.npmjs.org and the service. What it changes: on a runner GitHub does not host, the machine is the
# caller's, and what an earlier job of the repository left on it (a tool cache, a hook, a changed binary)
# runs in the send job too, next to the id-token; "sends only what `check` wrote" then holds as far as that
# machine is clean. The token says so (runner_environment: self-hosted), and the service decides on that
# claim: today it refuses it (runner-not-hosted, ADR-0003), so with a self-hosted `runner` the check and
# its verdict run and the upload is answered "not accepted".
name: runward hosted send
on:
  workflow_call:
    inputs:
      mission: { type: string, required: true, description: "the mission id declared in the app (^[a-z0-9][a-z0-9-]{0,62}$)" }
      path: { type: string, default: ".", description: "the mission's directory in the repository, relative, without .." }
      send-strict: { type: boolean, default: false, description: "fail the run when the upload fails" }
      runward-version: { type: string, default: "0.46.0", description: "one of the closed list of this release" }
      runner: { type: string, default: '"ubuntu-24.04"', description: "where the three jobs run, as JSON: a label or a list of labels" }
permissions: {}
jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions: { contents: read }
    outputs:
      exit: ${{ steps.check.outputs.exit }}
      sha256: ${{ steps.check.outputs.sha256 }}
      artifact-id: ${{ steps.up.outputs['artifact-id'] }}
    steps:
      - name: validate the inputs (data, never interpolated into a script)
        env: { MISSION: "${{ inputs.mission }}", MPATH: "${{ inputs.path }}", RWV: "${{ inputs.runward-version }}" }
        run: |
          [[ "$MISSION" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || { echo "::error::mission must match ^[a-z0-9][a-z0-9-]{0,62}$"; exit 2; }
          [[ "$MPATH" =~ ^[A-Za-z0-9._/-]{1,200}$ && "$MPATH" != /* && ! "$MPATH" =~ (^|/)\.\.(/|$) ]] || { echo "::error::path must be relative, without .."; exit 2; }
          case "$RWV" in 0.46.0) ;; *) echo "::error::runward-version must be one of: 0.46.0"; exit 2;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "22" }
      - name: install runward, integrity checked, outside the checkout, without scripts
        env: { RWV: "${{ inputs.runward-version }}" }
        run: |
          set -euo pipefail
          declare -A SHA512=( ["0.46.0"]="+O+Q8yVcdxCNm9bsb9IbrIcHU5SB90hgfReoHdKolzCwTvBggWn7DXDu6IAhX84bHQ8M6qJks6yU6DHbtFyLIQ==" )
          mkdir -p "$RUNNER_TEMP/rw-cli" && cd "$RUNNER_TEMP/rw-cli"
          curl -sSfLo runward.tgz "https://registry.npmjs.org/runward/-/runward-$RWV.tgz"
          [ "$(openssl dgst -sha512 -binary runward.tgz | base64 -w0)" = "${SHA512[$RWV]}" ] || { echo "::error::runward $RWV tarball integrity mismatch"; exit 1; }
          npm install --ignore-scripts --no-audit --no-fund --no-save --prefix . ./runward.tgz >/dev/null
      - id: check
        name: runward check --strict --json (exit code captured; --hooks never passed)
        env: { MPATH: "${{ inputs.path }}" }
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/rw"
          cd "$GITHUB_WORKSPACE/$MPATH"
          "$RUNNER_TEMP/rw-cli/node_modules/.bin/runward" check --strict --json > "$RUNNER_TEMP/rw/check.json"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/rw/check.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "runward check: exit $code"
          exit 0
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runward-hosted-check-${{ inputs.mission }}
          path: ${{ runner.temp }}/rw/check.json
          if-no-files-found: error
          retention-days: 3

  send:
    needs: check
    if: ${{ always() && needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { artifact-ids: "${{ needs.check.outputs['artifact-id'] }}", path: "${{ runner.temp }}/rw" }
      - name: send what runward wrote (one fresh token per file)
        env:
          MISSION: ${{ inputs.mission }}
          STRICT: ${{ inputs.send-strict }}
          WANT_SHA256: ${{ needs.check.outputs.sha256 }}
          SERVICE: https://app.runward.dev
        run: |
          cat > "$RUNNER_TEMP/send.mjs" <<'SEND'
          import { readFileSync, writeFileSync, appendFileSync, readdirSync, statSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const { MISSION, STRICT, WANT_SHA256, SERVICE, RUNNER_TEMP, GITHUB_STEP_SUMMARY, ACTIONS_ID_TOKEN_REQUEST_URL: TU, ACTIONS_ID_TOKEN_REQUEST_TOKEN: TT } = process.env;
          const find = (d) => readdirSync(d).flatMap((e) => (statSync(join(d, e)).isDirectory() ? find(join(d, e)) : [join(d, e)]));
          const file = find(join(RUNNER_TEMP, "rw")).find((f) => f.endsWith("/check.json"));
          const summary = (lines) => appendFileSync(GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const bytes = file ? readFileSync(file) : null;
          if (!bytes || createHash("sha256").update(bytes).digest("hex") !== WANT_SHA256) {
            console.log("::error::the artifact is not the file the check job wrote"); process.exit(1);
          }
          // the token request has its own deadline: a token endpoint that does not answer is an attempt
          // that failed, retried like an unavailable service, never a job held until GitHub's 6 h
          async function oidc() {
            const r = await fetch(`${TU}&audience=${encodeURIComponent(SERVICE)}`, { headers: { authorization: `Bearer ${TT}` }, signal: AbortSignal.timeout(10000) });
            if (!r.ok) throw new Error(`id-token ${r.status}`);
            return (await r.json()).value;
          }
          let out = null, last = null;
          // retries with backoff: four attempts, 2 s, 8 s, 30 s; a named refusal (4xx) is never retried
          const waits = [0, 2000, 8000, 30000];
          for (let i = 0; i < waits.length && !out; i++) {
            await sleep(waits[i]);
            try {
              const r = await fetch(`${SERVICE}/api/v0/exports`, {
                method: "POST", signal: AbortSignal.timeout(30000),
                headers: { authorization: `Bearer ${await oidc()}`, "runward-mission": MISSION, "runward-export-kind": "check", "content-type": "application/json", "content-digest": `sha-256=:${createHash("sha256").update(bytes).digest("base64")}:` },
                body: bytes,
              });
              const body = await r.json().catch(() => ({}));
              if (r.status < 500 && r.status !== 429) out = { status: r.status, body, requestId: r.headers.get("runward-request-id") };
              else last = { status: r.status, body };
            } catch (e) { last = { error: String(e.message) }; }
          }
          const b = out?.body ?? {};
          const lines = ["### runward hosted", ""];
          if (out && (out.status === 201 || out.status === 202)) {
            const what = out.status === 202 ? "kept, awaiting confirmation in the app" : b.current === false ? "sent (older than the current upload: kept as history)" : "sent";
            lines.push(`runward hosted: ${what}`, "", `- entry: ${b.entry}`, `- seq: ${b.seq}`, `- head: ${b.head}`, `- index: ${b.indexSha256 ?? "unchanged"}`, `- request: ${out.requestId}`);
            console.log(`::notice title=runward hosted anchor::seq=${b.seq} head=${b.head} index=${b.indexSha256 ?? ""} request=${out.requestId}`);
          } else if (out) {
            lines.push("runward hosted: not accepted", "", `- code: ${b.refusal}`, `- why: ${b.message}`, `- action: ${b.action}`, `- request: ${out.requestId}`);
            console.log(`::warning title=runward hosted not accepted::${b.refusal}: ${b.action}`);
          } else {
            lines.push("runward hosted: not sent: service unavailable after 4 attempts", "", "- re-run this job to send it", "- (warning only: this run keeps runward's verdict)");
            console.log(`::warning title=runward hosted not sent::service unavailable after 4 attempts (${JSON.stringify(last).slice(0, 200)})`);
          }
          summary(lines);
          writeFileSync(join(RUNNER_TEMP, "runward-hosted-receipt.json"), JSON.stringify({ format: "runward-hosted-receipt/0", mission: MISSION, status: out?.status ?? null, sha256: WANT_SHA256, ...b }, null, 2));
          const ok = out && (out.status === 201 || out.status === 202);
          process.exit(ok || STRICT !== "true" ? 0 : 1);
          SEND
          node "$RUNNER_TEMP/send.mjs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with: { name: "runward-hosted-receipt-${{ inputs.mission }}", path: "${{ runner.temp }}/runward-hosted-receipt.json", if-no-files-found: ignore, retention-days: 30 }

  verdict:
    needs: [check, send]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions: {}
    steps:
      - name: runward's verdict, given back to the run
        env: { CODE: "${{ needs.check.outputs.exit }}", CHECK: "${{ needs.check.result }}", EVENT: "${{ github.event_name }}", REF: "${{ github.ref }}" }
        run: |
          [ "$CHECK" = "success" ] || { echo "the check job did not run to its end"; exit 1; }
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ]; then echo "### runward hosted" >> "$GITHUB_STEP_SUMMARY"; echo "runward hosted: not sent: only a push to main sends" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "runward check: exit $CODE"
          exit "$CODE"
