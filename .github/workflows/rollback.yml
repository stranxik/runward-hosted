# The manual rollback of the closed list (ADR-0110, PADR-0015 point 6), WRITTEN BUT OFF until
# RW_DEPLOY_ENABLED is true. It redeploys a digest that a past deploy's evidence named green, then waits
# for /api/version to serve it. It never builds anything. Runbook: runward/runbook.md, "Roll back".
# Only the service is rolled back: the operator's gateway keeps the newest schema's code (migrations are
# expansion only, ADR-0016). The container's environment is merged, never replaced, and RW_COMMIT is
# removed so the image's own (a build argument) applies (scripts/container-deploy.sh).
name: rollback
on:
  workflow_dispatch:
    inputs:
      digest: { description: "the registry image digest to serve again (rg.fr-par.scw.cloud/runward/runward-hosted@sha256:...)", required: true, type: string }
permissions: {}
jobs:
  rollback:
    if: ${{ vars.RW_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: redeploy by digest, then wait for /api/version
        env: { SCW_SECRET_KEY: "${{ secrets.SCW_SECRET_KEY }}", CONTAINER: "${{ vars.SCW_CONTAINER_ID }}", DIGEST: "${{ inputs.digest }}" }
        run: |
          start=$(date +%s)
          scripts/container-deploy.sh "$CONTAINER" "$DIGEST"
          for i in $(seq 1 60); do
            if [ "$(curl -sf --max-time 30 https://app.runward.dev/api/version | jq -r .image)" = "$DIGEST" ]; then echo "rolled back in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi; sleep 10
          done; exit 1
