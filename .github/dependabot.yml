# Dependency updates, proposed as pull requests and merged only through CI (lint, tests, committed
# reports, audit). Actions stay pinned by commit; Dependabot rewrites the pin and its comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-tools: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
